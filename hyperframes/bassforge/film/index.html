<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Mont"; src: url("assets/fonts/montserrat-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; font-style: normal; }
      :root { --brand: #8b5cf6; --brand2: #c4b5fd; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; font-family: "Mont", sans-serif; overflow: hidden; background: #000; }
      .shot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; transform-origin: 50% 38%; }
      #fadebot { position: absolute; left: 0; top: 1380px; width: 1080px; height: 540px; background: linear-gradient(180deg, rgba(0,0,0,0) 0, #000 200px, #000 100%); z-index: 2; }
      .cap { position: absolute; left: 65px; right: 65px; top: 795px; text-align: center; z-index: 30; }
      .cap .in { display: inline-block; color: #fff; font-weight: 900; line-height: 1.1; white-space: nowrap; paint-order: stroke fill; -webkit-text-stroke: 14px #000; text-shadow: 0 8px 18px rgba(0,0,0,.7); }
      #card { position: absolute; left: 65px; top: 865px; width: 950px; height: 385px; border-radius: 24px; overflow: hidden; z-index: 20;
              background: #14121c; box-shadow: 0 0 0 3px rgba(139,92,246,.75), 0 0 44px rgba(139,92,246,.45), 0 24px 70px rgba(0,0,0,.8); }
      #stage { position: absolute; left: 0; top: 0; width: 2000px; height: 1591px; transform-origin: 0 0; }
      #stage > img.base { position: absolute; left: 0; top: 0; width: 2000px; height: 1591px; display: block; }
      .note { position: absolute; display: block; transform-origin: 50% 50%; }
      #playhead { position: absolute; left: 80px; top: 345px; width: 4px; height: 405px; background: #e9e2ff; box-shadow: 0 0 14px #a78bfa, 0 0 30px rgba(139,92,246,.8); opacity: 0; }
      #gen { position: absolute; left: 905px; top: 1020px; width: 325px; height: 325px; transform-origin: 50% 50%; }
      #genring { position: absolute; left: 918px; top: 1032px; width: 300px; height: 300px; border-radius: 50%; border: 6px solid var(--brand2); box-shadow: 0 0 40px var(--brand), inset 0 0 30px rgba(139,92,246,.6); opacity: 0; transform-origin: 50% 50%; }
      #drag { position: absolute; left: 1100px; top: 1355px; width: 210px; height: 210px; transform-origin: 50% 50%; }
      #clipReal, #ghost { position: absolute; left: 933px; top: 7px; width: 238px; height: 161px; }
      #clipReal { opacity: 0; }
      #ghost { opacity: 0; transform-origin: 50% 50%; }
      #ghost img { width: 100%; height: 100%; display: block; border-radius: 6px; box-shadow: 0 0 30px rgba(139,92,246,.9); opacity: .92; }
      #ghost svg { position: absolute; left: 55%; top: 55%; width: 70px; height: 70px; filter: drop-shadow(0 3px 6px rgba(0,0,0,.7)); }
      #menu { position: absolute; left: 134px; top: 0; width: 802px; height: 680px; transform-origin: 0 0; opacity: 0; }
      #menu img { position: absolute; left: 0; top: 0; width: 802px; height: 680px; display: block; }
      #menu .hl { position: absolute; left: 50px; top: 175px; width: 545px; height: 42px; border-radius: 8px; background: rgba(139,92,246,.35); box-shadow: 0 0 22px rgba(139,92,246,.55); }
      #menu .check { position: absolute; left: 62px; top: 176px; color: #fff; font: 700 30px/40px "Mont", sans-serif; }
      #menu .lblbg { position: absolute; left: 178px; top: 53px; width: 168px; height: 28px; background: rgb(53,51,72); }
      #menu .lbl { position: absolute; left: 61px; top: 50px; width: 400px; text-align: center; color: #fff; font: 700 17px/34px "Mont", sans-serif; letter-spacing: 1.5px; transform-origin: 50% 50%; }
      #panel { position: absolute; left: 0; top: 0; width: 950px; height: 385px; opacity: 0; background: radial-gradient(ellipse at 50% 40%, #2a2140, #14121c 75%); }
      #panel .wm { position: absolute; left: 230px; top: 132px; width: 490px; height: 120px; transform-origin: 50% 50%; }
      #panel .row { position: absolute; left: 0; right: 0; text-align: center; color: #fff; font-weight: 900; white-space: nowrap; opacity: 0; }
      #panel .price { top: 108px; font-size: 128px; line-height: 1; letter-spacing: -3px; text-shadow: 0 0 40px rgba(139,92,246,.7); }
      #panel .once { top: 262px; }
      #panel .once span, #panel .cta span { display: inline-block; padding: 14px 40px; border-radius: 60px; background: var(--brand); color: #fff; font-size: 44px; letter-spacing: 2px; box-shadow: 0 0 34px rgba(139,92,246,.6); }
      #panel .os { top: 140px; font-size: 46px; letter-spacing: 1px; }
      #panel .fmt { top: 220px; font-size: 40px; color: var(--brand2); letter-spacing: 3px; }
      #panel .cta { top: 150px; }
      #panel .cta span { font-size: 64px; padding: 22px 64px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16.533" data-width="1080" data-height="1920">
      <!-- Rosto em tela cheia (sem bordas), subido para a faixa segura. 1,25x: cada quadro de 24 fps = 1 quadro de 30 fps -->
      <video id="face" class="clip shot" src="assets/raw/face-1.25x.mp4" data-start="0" data-duration="16.033" data-media-start="0" data-track-index="0" muted playsinline style="z-index: 1"></video>
      <div id="fadebot" class="clip" data-start="0" data-duration="16.533" data-track-index="9"></div>

      <!-- Voz do Lucas (Voice Changer do diálogo do Veo), 30 ms do ElevenLabs cortados, acelerada 1,25x, 40 ms adiantada -->
      <audio id="voice" class="clip" src="assets/voice/voz-lucas-1.25x.wav" data-start="0.06" data-duration="15.95" data-media-start="0" data-track-index="1" data-volume="1"></audio>
      <!-- Bateria 120 bpm (sintetizada, sem baixo) -->
      <audio id="drums" class="clip" src="assets/audio/drums-120.wav" data-start="1.353" data-duration="15.180" data-media-start="1.253" data-track-index="2" data-volume="0.16" data-fade-out="0.6"></audio>
      <audio id="bass0" class="clip" src="assets/audio/bass-afro.wav" data-start="0.100" data-duration="1.253" data-media-start="0.000" data-track-index="3" data-volume="0.32"></audio>
      <audio id="s-pop1" class="clip" src="assets/sfx/pop.wav" data-start="1.333" data-duration="0.600" data-track-index="5" data-volume="0.14"></audio>
      <audio id="s-click" class="clip" src="assets/sfx/click.wav" data-start="3.450" data-duration="0.600" data-track-index="6" data-volume="0.32"></audio>
      <audio id="s-tick-notes" class="clip" src="assets/sfx/tick.wav" data-start="3.980" data-duration="0.600" data-track-index="5" data-volume="0.16"></audio>
      <audio id="s-t1" class="clip" src="assets/sfx/tick.wav" data-start="4.760" data-duration="0.600" data-track-index="6" data-volume="0.2"></audio>
      <audio id="s-t2" class="clip" src="assets/sfx/tick.wav" data-start="5.893" data-duration="0.600" data-track-index="5" data-volume="0.2"></audio>
      <audio id="s-t3" class="clip" src="assets/sfx/tick.wav" data-start="7.027" data-duration="0.600" data-track-index="6" data-volume="0.2"></audio>
      <audio id="s-whoosh2" class="clip" src="assets/sfx/whoosh.wav" data-start="8.867" data-duration="0.600" data-track-index="5" data-volume="0.18"></audio>
      <audio id="s-pop2" class="clip" src="assets/sfx/pop.wav" data-start="9.783" data-duration="0.600" data-track-index="6" data-volume="0.2"></audio>
      <audio id="s-whoosh3" class="clip" src="assets/sfx/whoosh.wav" data-start="10.553" data-duration="0.600" data-track-index="5" data-volume="0.18"></audio>
      <audio id="s-pop3" class="clip" src="assets/sfx/pop.wav" data-start="11.483" data-duration="0.600" data-track-index="6" data-volume="0.16"></audio>
      <audio id="s-pop4" class="clip" src="assets/sfx/pop.wav" data-start="13.983" data-duration="0.600" data-track-index="5" data-volume="0.16"></audio>
      <audio id="s-pop5" class="clip" src="assets/sfx/pop.wav" data-start="14.783" data-duration="0.600" data-track-index="6" data-volume="0.18"></audio>
      <audio id="s-ding" class="clip" src="assets/sfx/ding.wav" data-start="16.083" data-duration="0.450" data-track-index="5" data-volume="0.18"></audio>

      <!-- Plugin (interface real animada) -->
      <div id="card" class="clip" data-start="0.6" data-duration="15.933" data-track-index="8">
        <div id="stage">
          <img class="base" src="assets/ui/stage-base.png" alt="Interface do BassForge" />
          <img class="note" id="n0" src="assets/ui/note0.png" alt="" style="left:131px;top:609px;width:159px;height:44px" />
          <img class="note" id="n1" src="assets/ui/note1.png" alt="" style="left:429px;top:609px;width:159px;height:44px" />
          <img class="note" id="n2" src="assets/ui/note2.png" alt="" style="left:727px;top:374px;width:129px;height:44px" />
          <img class="note" id="n3" src="assets/ui/note3.png" alt="" style="left:906px;top:609px;width:55px;height:44px" />
          <img class="note" id="n4" src="assets/ui/note4.png" alt="" style="left:966px;top:676px;width:77px;height:44px" />
          <img class="note" id="n5" src="assets/ui/note5.png" alt="" style="left:1085px;top:609px;width:218px;height:44px" />
          <img class="note" id="n6" src="assets/ui/note6.png" alt="" style="left:1383px;top:609px;width:137px;height:44px" />
          <img class="note" id="n7" src="assets/ui/note7.png" alt="" style="left:1681px;top:374px;width:77px;height:44px" />
          <img class="note" id="n8" src="assets/ui/note8.png" alt="" style="left:1860px;top:609px;width:47px;height:44px" />
          <img class="note" id="n9" src="assets/ui/note9.png" alt="" style="left:1920px;top:609px;width:47px;height:44px" />
          <div id="playhead"></div>
          <img id="gen" src="assets/ui/gen-btn.png" alt="" /><div id="genring"></div>
          <img id="drag" src="assets/ui/drag-btn.png" alt="" />
          <img id="clipReal" src="assets/ui/clip.png" alt="" />
          <div id="ghost"><img src="assets/ui/clip.png" alt="" /><svg viewBox="0 0 24 24"><path d="M4 2l15 11-6.5 1 3.6 7.2-2.6 1.3-3.6-7.2L4 20z" fill="#fff" stroke="#000" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
        </div>
        <div id="menu"><img src="assets/ui/menu-base.png" alt="Estilos do BassForge" /><div class="hl"></div><div class="check">✓</div></div>
        <div id="panel">
          <img class="wm" src="assets/ui/wordmark-a.png" alt="BassForge by Kalox" />
          <div class="row price">R$ 18,90</div>
          <div class="row once"><span>PAGAMENTO ÚNICO</span></div>
          <div class="row os">macOS · APPLE SILICON + INTEL</div>
          <div class="row fmt">VST3 · AU</div>
          <div class="row cta"><span>SAIBA MAIS</span></div>
        </div>
      </div>

      <!-- Legendas (brancas, contorno preto), entre o queixo e o plugin -->
      <div id="k1" class="clip cap" data-start="0" data-duration="2.167" data-track-index="7"><span class="in" style="font-size: 52px; letter-spacing: 1px">PLUGIN MIDI · VST3 · AU</span></div>
      <div id="k2" class="clip cap" data-start="3.350" data-duration="1.350" data-track-index="7"><span class="in" style="font-size: 58px">1 CLIQUE</span></div>
      <div id="k3" class="clip cap" data-start="4.700" data-duration="3.567" data-track-index="7"><span class="in" style="font-size: 56px">8 ESTILOS DE HOUSE</span></div>
      <div id="k4" class="clip cap" data-start="8.617" data-duration="2.017" data-track-index="7"><span class="in" style="font-size: 56px">ARRASTA PRA DAW</span></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const pop = (sel, t) => tl.fromTo(sel, { scale: 0.5, opacity: 0, y: 30 }, { scale: 1, opacity: 1, y: 0, duration: 0.22, ease: "back.out(2.2)" }, t);
      const out = (sel, t) => tl.to(sel, { scale: 0.8, opacity: 0, y: -14, duration: 0.1, ease: "power2.in" }, t - 0.1);

      // ---------- rosto: sobe para a faixa segura + zoom-cut a cada trecho (os cortes ficam nas pausas)
      gsap.set("#face", { y: -340 });
      gsap.set("#panel .wm", { scale: 1.6 });
      tl.set("#face", { scale: 1.0 }, 0.000).to("#face", { scale: 1.03, duration: 1.323, ease: "none" }, 0.000);  // A1 Escuta essa linha de baixo.
      tl.set("#face", { scale: 1.07 }, 1.333).to("#face", { scale: 1.09, duration: 0.823, ease: "none" }, 1.333);  // A2 Esse plugin
      tl.set("#face", { scale: 1.0 }, 2.167).to("#face", { scale: 1.04, duration: 2.523, ease: "none" }, 2.167);  // A3 gerou ela com um clique.
      tl.set("#face", { scale: 1.06 }, 4.700).to("#face", { scale: 1.08, duration: 1.123, ease: "none" }, 4.700);  // B1 Afro House.
      tl.set("#face", { scale: 1.0 }, 5.833).to("#face", { scale: 1.02, duration: 1.123, ease: "none" }, 5.833);  // B2 Deep House.
      tl.set("#face", { scale: 1.06 }, 6.967).to("#face", { scale: 1.08, duration: 1.290, ease: "none" }, 6.967);  // B3 Tech House.
      tl.set("#face", { scale: 1.0 }, 8.267).to("#face", { scale: 1.04, duration: 2.357, ease: "none" }, 8.267);  // C1 Gostou? Arrasta pra sua DAW.
      tl.set("#face", { scale: 1.07 }, 10.633).to("#face", { scale: 1.09, duration: 0.790, ease: "none" }, 10.633);  // D1 BassForge.
      tl.set("#face", { scale: 1.0 }, 11.433).to("#face", { scale: 1.03, duration: 2.490, ease: "none" }, 11.433);  // D2 Dezoito e noventa, pagamento único.
      tl.set("#face", { scale: 1.06 }, 13.933).to("#face", { scale: 1.08, duration: 0.790, ease: "none" }, 13.933);  // D3 Só pra Mac.
      tl.set("#face", { scale: 1.0 }, 14.733).to("#face", { scale: 1.04, duration: 1.290, ease: "none" }, 14.733);  // D4 Toca em Saiba mais.

      // ---------- legendas
      pop("#k1 .in", 0.05); out("#k1 .in", 2.167);
      pop("#k2 .in", 3.350); out("#k2 .in", 4.700);
      pop("#k3 .in", 4.700); out("#k3 .in", 8.267);
      pop("#k4 .in", 8.617); out("#k4 .in", 10.633);

      // ---------- plugin: entra cedo e fica; câmera passeia pela interface real
      tl.fromTo("#card", { y: 80, opacity: 0, scale: 0.94 }, { y: 0, opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 0.6);
      tl.set("#stage", { x: -57.8, y: -201.3, scale: 0.72 }, 0.000);
      tl.set("#playhead", { x: 0, opacity: 1 }, 0.100).to("#playhead", { x: 598.5, duration: 1.253, ease: "none" }, 0.100).set("#playhead", { opacity: 0 }, 1.353);
      tl.fromTo("#n0", { filter: "brightness(1.9) saturate(1.3)" }, { filter: "brightness(1) saturate(1)", duration: 0.35, ease: "power2.out", immediateRender: false }, 0.228);
      tl.fromTo("#n1", { filter: "brightness(1.9) saturate(1.3)" }, { filter: "brightness(1) saturate(1)", duration: 0.35, ease: "power2.out", immediateRender: false }, 0.852);
      // "gerou ela com um clique": vai até o GENERATE e aperta
      tl.to("#stage", { x: -185.9, y: -532.9, scale: 0.62, duration: 0.55, ease: "power2.inOut" }, 2.167);
      tl.to("#gen", { scale: 0.92, duration: 0.08, ease: "power2.in" }, 3.450).to("#gen", { scale: 1, duration: 0.25, ease: "back.out(3)" }, 3.530);
      tl.fromTo("#genring", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1.12, duration: 0.25, ease: "power2.out", immediateRender: false }, 3.450).to("#genring", { opacity: 0, duration: 0.35 }, 3.750);
      tl.to(".note", { opacity: 0, scale: 0.6, duration: 0.1 }, 3.450);
      // volta ao piano roll: as notas nascem uma a uma e tocam
      tl.to("#stage", { x: -57.8, y: -201.3, scale: 0.72, duration: 0.45, ease: "power2.inOut" }, 3.630);
      tl.fromTo(".note", { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2.5)", stagger: 0.04, immediateRender: false }, 3.980);

      // ---------- estilos: menu real, a seleção desce Afro → Deep → Tech
      tl.to("#stage", { opacity: 0, duration: 0.2 }, 4.600);
      tl.fromTo("#menu", { opacity: 0, scale: 0.7, y: -80 }, { opacity: 1, scale: 0.85, y: -100, duration: 0.3, ease: "back.out(1.6)", immediateRender: false }, 4.650);
      tl.to("#menu .hl", { y: 0, duration: 0.16, ease: "power2.out" }, 4.760).to("#menu .check", { y: 0, duration: 0.16, ease: "power2.out" }, 4.760);
      tl.fromTo("#menu .hl", { opacity: 1 }, { opacity: 0.55, duration: 0.5, ease: "power1.out", immediateRender: false }, 4.920);
      tl.to("#menu .hl", { y: 88, duration: 0.16, ease: "power2.out" }, 5.893).to("#menu .check", { y: 88, duration: 0.16, ease: "power2.out" }, 5.893);
      tl.fromTo("#menu .hl", { opacity: 1 }, { opacity: 0.55, duration: 0.5, ease: "power1.out", immediateRender: false }, 6.053);
      tl.to("#menu .hl", { y: 132, duration: 0.16, ease: "power2.out" }, 7.027).to("#menu .check", { y: 132, duration: 0.16, ease: "power2.out" }, 7.027);
      tl.fromTo("#menu .hl", { opacity: 1 }, { opacity: 0.55, duration: 0.5, ease: "power1.out", immediateRender: false }, 7.187);

      // ---------- arrasta pra DAW: o clip sai do botão e cai na pista
      tl.to("#menu", { opacity: 0, duration: 0.2 }, 8.217);
      tl.set("#stage", { x: -248.0, y: -569.5, scale: 0.6 }, 8.217);
      tl.to("#stage", { opacity: 1, duration: 0.2 }, 8.217);
      tl.to("#drag", { scale: 0.9, duration: 0.1 }, 8.717).to("#drag", { scale: 1, duration: 0.2, ease: "back.out(3)" }, 8.817);
      tl.fromTo("#ghost", { opacity: 0, x: 153, y: 1372, scale: 0.5 }, { opacity: 1, scale: 0.8, duration: 0.15, immediateRender: false }, 8.717);
      tl.to("#ghost", { x: 0, y: 0, scale: 1, duration: 0.867, ease: "power2.inOut" }, 8.867);
      tl.to("#stage", { x: -103.6, y: 11.0, scale: 0.55, duration: 0.9165999999999993, ease: "power2.inOut" }, 8.867);
      tl.set("#clipReal", { opacity: 1 }, 9.783).to("#ghost", { opacity: 0, duration: 0.15 }, 9.783);
      tl.fromTo("#clipReal", { scale: 1.15, filter: "brightness(1.6)" }, { scale: 1, filter: "brightness(1)", duration: 0.35, ease: "back.out(2)", immediateRender: false }, 9.783);

      // ---------- preço / Mac / Saiba mais (logo real)
      tl.to("#stage", { opacity: 0, duration: 0.2 }, 10.533);
      tl.fromTo("#panel", { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, 10.533);
      tl.fromTo("#panel .wm", { scale: 1.1, opacity: 0 }, { scale: 1.6, opacity: 1, duration: 0.35, ease: "back.out(1.8)", immediateRender: false }, 10.583);
      tl.to("#panel .wm", { scale: 0.72, y: -118, duration: 0.3, ease: "power2.inOut" }, 11.433);
      tl.fromTo("#panel .price", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, 11.483);
      tl.fromTo("#panel .once", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.25, ease: "back.out(1.8)", immediateRender: false }, 12.333);
      tl.to("#panel .price, #panel .once", { opacity: 0, y: -20, duration: 0.15 }, 13.883);
      tl.fromTo("#panel .os", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25, ease: "back.out(1.8)", immediateRender: false }, 13.953);
      tl.fromTo("#panel .fmt", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25, ease: "back.out(1.8)", immediateRender: false }, 14.133);
      tl.to("#panel .os, #panel .fmt", { opacity: 0, y: -20, duration: 0.15 }, 14.683);
      tl.fromTo("#panel .cta", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)", immediateRender: false }, 14.753);
      tl.to("#panel .cta span", { scale: 1.07, duration: 0.3, repeat: 3, yoyo: true, ease: "sine.inOut" }, 15.133);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
