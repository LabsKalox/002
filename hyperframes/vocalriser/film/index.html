      .card img.fxoff.ch { left: 400px; top: 862px; } .card img.fxoff.tr { left: 612px; top: 862px; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="26" data-width="1080" data-height="1920">
      <!-- Intro: full plugin UI, smaller and static; riser 02 ends on the cut. -->
      <div id="ui" class="clip" data-start="0" data-duration="2.5" data-track-index="8">
        <img class="bg" src="assets/brand/ui-bg.png" alt="" />
        <div class="card" id="card0" style="left: 184px; top: 607px; transform-origin: 0 0; transform: scale(0.72)"><img src="assets/brand/ui-window-noind.png" alt="Interface do Vocal Riser" /><div class="wglow"></div><div class="kind"></div><img class="fxoff ch" src="assets/brand/chorus-off.png" alt="" /><img class="fxoff tr" src="assets/brand/tremolo-off.png" alt="" /><div class="fxglow ch"></div><div class="fxglow tr"></div></div>

      <video id="t2" class="clip shot" src="assets/raw/02.mp4" data-start="8.9" data-duration="7.45" data-media-start="0" data-track-index="0" muted playsinline style="z-index: 2"></video>
      <video id="t3" class="clip shot" src="assets/raw/03.mp4" data-start="16.35" data-duration="7.93" data-media-start="0" data-track-index="0" muted playsinline style="z-index: 3"></video>

      <audio id="whoosh-2" class="clip" src="assets/sfx/whoosh.wav" data-start="8.65" data-duration="0.6" data-track-index="3" data-volume="0.25"></audio>
      <audio id="whoosh-ui" class="clip" src="assets/sfx/whoosh.wav" data-start="11.05" data-duration="0.6" data-track-index="3" data-volume="0.3"></audio>
      <audio id="whoosh-3" class="clip" src="assets/sfx/whoosh.wav" data-start="14.85" data-duration="0.6" data-track-index="3" data-volume="0.22"></audio>
      <audio id="whoosh-4" class="clip" src="assets/sfx/whoosh.wav" data-start="16.1" data-duration="0.6" data-track-index="3" data-volume="0.22"></audio>
      <audio id="pop-1" class="clip" src="assets/sfx/pop.wav" data-start="5.745" data-duration="0.2" data-track-index="3" data-volume="0.2"></audio>
      <audio id="hit-name" class="clip" src="assets/sfx/hit.wav" data-start="9.105" data-duration="0.7" data-track-index="4" data-volume="0.22"></audio>
      <audio id="pop-ui" class="clip" src="assets/sfx/pop.wav" data-start="11.2" data-duration="0.2" data-track-index="3" data-volume="0.22"></audio>
      <audio id="tick-1" class="clip" src="assets/sfx/tick.wav" data-start="11.55" data-duration="0.03" data-track-index="5" data-volume="0.16"></audio>
      <audio id="tick-2" class="clip" src="assets/sfx/tick.wav" data-start="11.7" data-duration="0.03" data-track-index="5" data-volume="0.16"></audio>
      <audio id="tick-3" class="clip" src="assets/sfx/tick.wav" data-start="11.85" data-duration="0.03" data-track-index="5" data-volume="0.16"></audio>
      <audio id="tick-4" class="clip" src="assets/sfx/tick.wav" data-start="12.0" data-duration="0.03" data-track-index="5" data-volume="0.16"></audio>
      <audio id="click-ch" class="clip" src="assets/sfx/click.wav" data-start="13.5" data-duration="0.07" data-track-index="5" data-volume="0.2"></audio>
      <audio id="click-tr" class="clip" src="assets/sfx/click.wav" data-start="14.2" data-duration="0.07" data-track-index="5" data-volume="0.2"></audio>

      <!-- Persistent headline -->

        <div class="hin"><span class="l1" data-var-text="headline1">Riser de vocal</span><span class="l2" data-var-text="headline2">SEM AUTOMAÇÃO</span></div>
      </div>

      <!-- Captions (white with black outline), timed to the voice. During the UI close-up the highlighted
           real labels (REVERSE | 1 BAR, CHORUS, TREMOLO) carry those words, so no duplicate caption. -->
      <div id="c1" class="clip cap ink" data-start="2.675" data-duration="1.95" data-track-index="6"><span class="in">Esse riser que você<br />acabou de ouvir?</span></div>
      <div id="c2" class="clip cap ink" data-start="5.745" data-duration="2.98" data-track-index="6"><span class="in">Saiu de um pedaço<br />de vocal qualquer.</span></div>
      <div id="logo-title" class="clip" data-start="9.105" data-duration="1.96" data-track-index="6"><span class="in"><small>É o</small><img src="assets/brand/title-vocal-riser.png" alt="Vocal Riser" /></span></div>
      <div id="c6" class="clip cap ink" data-start="15.155" data-duration="1.15" data-track-index="6"><span class="in">num botão só.</span></div>
      <div id="c7" class="clip cap ink" data-start="16.465" data-duration="1.86" data-track-index="6"><span class="in">Feito pensando<br />em Afro House,</span></div>
      <div id="c8" class="clip cap ink" data-start="18.545" data-duration="2.12" data-track-index="6"><span class="in">mas encaixa<br />em qualquer drop.</span></div>
      <div id="c9" class="clip cap ink" data-start="21.465" data-duration="1.12" data-track-index="6"><span class="in">Comenta RISER</span></div>
      <div id="c10" class="clip cap ink" data-start="22.705" data-duration="0.69" data-track-index="6"><span class="in">que eu te mando.</span></div>

      <!-- Real plugin UI close-up while he names the controls -->
      <div id="ui2" class="clip" data-start="11.2" data-duration="3.9" data-track-index="8" style="position:absolute;left:0;top:0;width:1080px;height:1920px;z-index:12;overflow:hidden;pointer-events:none">
        <div class="card" id="card2" style="position:absolute;left:0;top:0;width:988px;height:981px;border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,0.85),0 0 0 3px rgba(98,245,10,0.55),0 0 60px rgba(98,245,10,0.3)"><img src="assets/brand/ui-window-noind.png" alt="Interface do Vocal Riser" style="display:block;width:988px;height:981px;border-radius:18px" />
          <div class="wglow"></div><div class="kind"></div><img class="fxoff ch" src="assets/brand/chorus-off.png" alt="" /><img class="fxoff tr" src="assets/brand/tremolo-off.png" alt="" /><div class="fxglow ch"></div><div class="fxglow tr"></div>
          <div class="ring-hl" id="hl-rev" style="position:absolute"></div><div class="ring-hl" id="hl-ch" style="position:absolute"></div><div class="ring-hl" id="hl-tr" style="position:absolute"></div></div>

        <div class="dim"></div>
        <div class="lockup"><img class="bm" src="assets/brand/title-vocal-riser.png" alt="Vocal Riser" /><img class="kx" src="assets/brand/logo-kalox.png" alt="Kalox Audio" /><span class="tag">COMENTA RISER</span></div>
      </div>
      <div id="flash-1" class="clip flash" data-start="2.5" data-duration="0.25" data-track-index="10"></div>
      <div id="flash-2" class="clip flash" data-start="16.35" data-duration="0.2" data-track-index="10"></div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const pop = (sel, t) => {
        tl.fromTo(sel, { scale: 0.62, opacity: 0 }, { scale: 1.08, opacity: 1, duration: 0.13, ease: "power2.out" }, t)
          .to(sel, { scale: 1, duration: 0.1, ease: "power1.inOut" }, t + 0.13);
      };

      tl.fromTo("#headline .hin", { scale: 1.06 }, { scale: 1, duration: 0.35, ease: "power3.out" }, 0);

      
      // T1: impact entrance, drift, punch-in on "saiu de um pedaço"
      tl.fromTo("#t1", { scale: 1.14 }, { scale: 1.0, duration: 0.3, ease: "power3.out" }, 2.5)
        .to("#t1", { scale: 1.04, duration: 2.94, ease: "none" }, 2.8);
      tl.set("#t1", { scale: 1.12 }, 5.745).to("#t1", { scale: 1.15, duration: 3.155, ease: "none" }, 5.745);

      // T2: drift (the UI close-up covers 11.2-15.1)
      tl.fromTo("#t2", { scale: 1.1 }, { scale: 1.02, duration: 0.3, ease: "power3.out" }, 8.9)
        .to("#t2", { scale: 1.05, duration: 2.0, ease: "none" }, 9.2);
      tl.set("#t2", { scale: 1.1 }, 15.1).to("#t2", { scale: 1.13, duration: 1.25, ease: "none" }, 15.1);

      // T3: entrance, drift, punch-in on "Comenta RISER"
      tl.fromTo("#t3", { scale: 1.14 }, { scale: 1.02, duration: 0.3, ease: "power3.out" }, 16.35)
        .to("#t3", { scale: 1.05, duration: 4.8, ease: "none" }, 16.65);
      tl.set("#t3", { scale: 1.12 }, 21.465).to("#t3", { scale: 1.15, duration: 2.8, ease: "none" }, 21.465);

      tl.fromTo("#flash-1", { opacity: 0.75 }, { opacity: 0, duration: 0.24, ease: "power2.out" }, 2.5);
      tl.fromTo("#flash-2", { opacity: 0.6 }, { opacity: 0, duration: 0.19, ease: "power2.out" }, 16.35);

      [["#c1 .in", 2.675], ["#c2 .in", 5.745], ["#c6 .in", 15.155], ["#c7 .in", 16.465], ["#c8 .in", 18.545],
       ["#c9 .in", 21.465], ["#c10 .in", 22.705]].forEach(([s, t]) => pop(s, t));

      // Name slam
      tl.fromTo("#logo-title .in", { scale: 1.6, opacity: 0 }, { scale: 0.97, opacity: 1, duration: 0.14, ease: "power3.out" }, 9.105)
        .to("#logo-title .in", { scale: 1, duration: 0.12 }, 9.245)
        .to("#logo-title .in", { scale: 1.04, duration: 1.7, ease: "none" }, 9.365);

      // UI: whole plugin, smaller, over the presenter; pops in, stays still, highlights follow the words
      tl.set("#card2", { transformOrigin: "50% 50%", x: 46, y: 870 }, 11.2);
      tl.fromTo("#card2", { scale: 0.46, opacity: 0 }, { scale: 0.6, opacity: 1, duration: 0.18, ease: "back.out(1.6)" }, 11.2)
        .to("#card2", { scale: 0.58, duration: 0.12, ease: "power1.out" }, 11.38)
        .to("#card2", { opacity: 0, scale: 0.54, duration: 0.2, ease: "power2.in" }, 14.9);
      tl.fromTo("#hl-rev", { opacity: 0 }, { opacity: 1, duration: 0.12 }, 11.5).to("#hl-rev", { opacity: 0, duration: 0.1 }, 13.4);
      tl.fromTo("#hl-ch", { opacity: 0 }, { opacity: 1, duration: 0.12 }, 13.55).to("#hl-ch", { opacity: 0, duration: 0.1 }, 14.9);
      tl.fromTo("#hl-tr", { opacity: 0 }, { opacity: 1, duration: 0.12 }, 14.2).to("#hl-tr", { opacity: 0, duration: 0.1 }, 14.9);

      // End card
      tl.fromTo("#endcard .dim", { opacity: 0 }, { opacity: 0.85, duration: 0.2 }, 23.4).to("#endcard .dim", { opacity: 1, duration: 0.4 }, 24.1);
      tl.fromTo("#endcard .lockup", { scale: 1.15, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "power3.out" }, 23.45);


      // Plugin animation (intro): knob turns to 1 BAR with the riser, waveform pulses, FX green blinks
      tl.set(".card .kind", { transformOrigin: "2.5px 163px" }, 0);
      tl.fromTo("#card0 .kind", { rotation: 0 }, { rotation: 58, duration: 1.15, ease: "power1.inOut" }, 1.15);
      tl.fromTo("#card0 .wglow", { opacity: 0.15 }, { opacity: 1, duration: 0.123, repeat: 9, yoyo: true, ease: "sine.inOut" }, 1.2);
      [1.3, 1.62, 1.94, 2.2].forEach((t, i) => {
        const fx = i % 2 ? "tr" : "ch";
        tl.set(`#card0 .fxoff.${fx}`, { opacity: 1 }, t).set(`#card0 .fxoff.${fx}`, { opacity: 0 }, t + 0.1);
        tl.fromTo(`#card0 .fxglow.${fx}`, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, t + 0.1);
      });

      // Plugin animation (mid): FX start off; knob turns on "reverse de um compasso"; CHORUS / TREMOLO switch on when spoken
      tl.set("#card2 .fxoff", { opacity: 1 }, 11.2).set("#card2 .fxglow", { opacity: 0 }, 11.2);
      tl.fromTo("#card2 .kind", { rotation: 0 }, { rotation: 58, duration: 0.6, ease: "steps(4)" }, 11.5);
      tl.fromTo("#card2 .wglow", { opacity: 0.2 }, { opacity: 0.9, duration: 0.246, repeat: 13, yoyo: true, ease: "sine.inOut" }, 11.5);
      [["ch", 13.5], ["tr", 14.2]].forEach(([fx, t]) => {
        tl.set(`#card2 .fxoff.${fx}`, { opacity: 0 }, t).set(`#card2 .fxoff.${fx}`, { opacity: 1 }, t + 0.1)
          .set(`#card2 .fxoff.${fx}`, { opacity: 0 }, t + 0.18);
        tl.fromTo(`#card2 .fxglow.${fx}`, { opacity: 1 }, { opacity: 0.35, duration: 0.123, repeat: 3, yoyo: true, immediateRender: false }, t);
      });

      // Attention beats elsewhere
